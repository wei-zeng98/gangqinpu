[build-system]
requires = ["setuptools>=77", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "gangqinpu"
version = "1.0.0"
description = "Loader, construction pipeline and expressive-performance classifier for the Gangqinpu piano dataset"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0 AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
authors = [
  {name = "Wei Zeng", email = "w.zeng@u.nus.edu"},
  {name = "Anvay Mathur"},
  {name = "Ye Wang"},
]
dependencies = ["numpy>=1.24,<2", "symusic==0.5.9"]

[project.optional-dependencies]
hub = ["datasets==4.4.1", "pyarrow==21.0.0", "pandas>=2.2,<3", "huggingface_hub>=0.36,<3"]
notation = ["partitura==1.9.0", "symupe==1.1.0", "mido==1.3.3"]
pipeline = ["partitura==1.9.0", "parangonar==3.3.2", "symupe==1.1.0", "mido==1.3.3", "scipy==1.14.1",
            "scikit-learn==1.6.1", "joblib==1.4.2", "transkun==2.0.1", "torch==2.5.1"]
genre = ["transformers==4.52.3", "librosa==0.10.2.post1", "soundfile==0.12.1"]

[tool.setuptools.packages.find]
include = ["gangqinpu*"]

[tool.setuptools.package-data]
"gangqinpu.classifier" = ["model.joblib"]
